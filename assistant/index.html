<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Store 9337 Training Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E0F13;--panel:#171922;--line:#262A38;--red:#FF1A1A;--blue:#0060FF;--hblue:#1E9BF0;--yel:#FFE600;--tx:#F2F3F7;--dim:#8A8FA3}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--ink);color:var(--tx);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;touch-action:manipulation}
header{position:relative;padding:40px 24px 28px;text-align:center;border-bottom:1px solid var(--line)}
/* iOS-style segmented control: a pill slides between the two options. */
.cardbar{display:flex;justify-content:flex-end;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex:none}
.langsw{position:relative;display:flex;align-items:center;background:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px;-webkit-tap-highlight-color:transparent}
.langsw .pill{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);background:var(--blue);border-radius:999px;transition:left .26s cubic-bezier(.4,0,.2,1)}
.langsw[data-lang="es"] .pill{left:calc(50%)}
.langsw button{position:relative;z-index:1;flex:1;min-width:42px;background:transparent;border:none;color:var(--dim);font-family:'Poppins',sans-serif;font-weight:800;font-size:11px;letter-spacing:1px;padding:6px 12px;cursor:pointer;transition:color .2s}
.langsw button.on{color:#fff}
@media (prefers-reduced-motion:reduce){.langsw .pill{transition:none}}
header b{font-family:'Poppins',sans-serif;font-weight:900;font-size:clamp(24px,4.5vw,36px);display:block;line-height:1.1;color:var(--hblue)}
header b span{color:var(--red)}
header small{color:var(--dim);font-weight:700;font-size:12px;letter-spacing:2px;display:block;margin-top:10px}
main{flex:1;max-width:820px;margin:0 auto;padding:28px 20px 0;width:100%;display:flex;flex-direction:column}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:60vh}
.chat{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.intro{color:var(--dim);font-size:14px;line-height:1.6}
.intro h2{font-family:'Poppins',sans-serif;font-weight:800;font-size:18px;color:var(--hblue);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:0}
.chip{background:transparent;border:1px solid var(--line);color:var(--tx);font-family:inherit;font-size:12.5px;padding:8px 12px;border-radius:999px;cursor:pointer;transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--blue);color:var(--hblue)}
.msg{max-width:88%;padding:12px 15px;border-radius:12px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--ink);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot.err{border-color:var(--red);color:#ffb3b3}
.msg .cursor{display:inline-block;width:7px;height:15px;background:var(--hblue);margin-left:2px;vertical-align:text-bottom;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
form{border-top:1px solid var(--line);padding:14px;display:flex;gap:10px;background:var(--panel)}
textarea{flex:1;resize:none;background:var(--ink);border:1px solid var(--line);border-radius:10px;color:var(--tx);font-family:inherit;font-size:16px;padding:12px 14px;line-height:1.4;max-height:140px}
textarea:focus{outline:none;border-color:var(--blue)}
button.send{background:var(--red);color:#fff;border:none;border-radius:10px;font-family:'Poppins',sans-serif;font-weight:800;font-size:14px;padding:0 22px;cursor:pointer;transition:opacity .15s}
button.send:disabled{opacity:.4;cursor:default}
footer{text-align:center;padding:16px;color:var(--dim);font-size:11px;letter-spacing:.5px}
/* Phones: full-bleed, app-like, safe-area aware. 16px inputs already prevent iOS focus-zoom. */
@media (max-width:640px){
  body{min-height:100vh;min-height:100dvh}
  header{padding:22px 16px 14px}
  header b{font-size:23px}
  header small{font-size:10px;letter-spacing:1.2px;margin-top:7px}
  .cardbar{padding:9px 12px}
  .langsw button{font-size:10px;padding:6px 10px}
  main{max-width:none;margin:0;padding:0}
  .card{border:none;border-top:1px solid var(--line);border-radius:0;min-height:0}
  .chat{padding:18px 16px;gap:14px}
  .intro h2{font-size:17px}
  .intro{font-size:13.5px}
  .chip{font-size:13px;padding:9px 13px}
  .msg{max-width:90%;font-size:15px}
  form{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
  button.send{padding:0 18px}
  footer{padding:12px 16px calc(10px + env(safe-area-inset-bottom));font-size:10.5px}
}
</style></head><body>
<header>
<b>STORE 9337 <span>ASSISTANT</span></b>
<small id="subtitle">RAINBOW PIZZA &middot; ASK THE TRAINING MATERIALS</small>
</header>
<main>
<div class="card">
  <div class="cardbar">
    <div class="langsw" id="langsw" data-lang="en">
      <span class="pill" aria-hidden="true"></span>
      <button type="button" data-lang="en" class="on">EN</button>
      <button type="button" data-lang="es">ES</button>
    </div>
  </div>
  <div class="chat" id="chat">
    <div class="intro" id="intro">
      <div class="chips" id="chips">
        <button class="chip">What's the walk-in cooler temperature range?</button>
        <button class="chip">How many pizzas are graded on an OA?</button>
        <button class="chip">What's the minimum end-bake temperature?</button>
        <button class="chip">What's the max cash in a single till?</button>
      </div>
    </div>
  </div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Ask a training question&hellip;" autocomplete="off"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</div>
</main>
<footer id="footer">Internal training tool &middot; Store 9337</footer>

<script>
// Where the serverless backend lives. Local preview auto-targets the dev harness;
// production points at the deployed Cloudflare Worker (replace after deploy).
const WORKER_ENDPOINT =
  (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? "http://localhost:8788"
    : "https://training-assistant.jessestrait.workers.dev";

// UI strings per language. The training corpus itself stays in English — the
// assistant translates its answer, so only the interface needs these.
const I18N = {
  en: {
    subtitle: "RAINBOW PIZZA · ASK THE TRAINING MATERIALS",
    placeholder: "Ask a training question…",
    send: "Send",
    footer: "Internal training tool · Store 9337",
    chips: [
      "What's the walk-in cooler temperature range?",
      "How many pizzas are graded on an OA?",
      "What's the minimum end-bake temperature?",
      "What's the max cash in a single till?",
    ],
    errReach: "Couldn't reach the assistant — ",
    errHttp: (s) => "Request failed (" + s + ").",
    errRead: "Couldn't read the response — ",
    errNone: "No answer returned.",
  },
  es: {
    subtitle: "RAINBOW PIZZA · CONSULTA LOS MATERIALES DE CAPACITACIÓN",
    placeholder: "Haz una pregunta sobre la capacitación…",
    send: "Enviar",
    footer: "Herramienta interna de capacitación · Tienda 9337",
    chips: [
      "¿Cuál es el rango de temperatura del cuarto frío?",
      "¿Cuántas pizzas se evalúan en un OA?",
      "¿Cuál es la temperatura mínima al salir del horno?",
      "¿Cuál es el máximo de efectivo en una sola caja?",
    ],
    errReach: "No se pudo conectar con el asistente — ",
    errHttp: (s) => "La solicitud falló (" + s + ").",
    errRead: "No se pudo leer la respuesta — ",
    errNone: "No se recibió respuesta.",
  },
};

const chat = document.getElementById("chat");
const intro = document.getElementById("intro");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const history = []; // [{role, content}]
let busy = false;

// Language preference, most durable source first. The URL wins because it
// survives a reload even when storage is restricted (iOS Private Browsing) —
// Safari reloads pages on its own after app switches or memory pressure, which
// otherwise dropped the choice back to English.
const isLang = (v) => v === "es" || v === "en";
let lang = "en";
try {
  const fromQuery = new URLSearchParams(location.search).get("lang");
  const fromHash = new URLSearchParams(location.hash.replace(/^#/, "")).get("lang");
  const saved = localStorage.getItem("assistantLang");
  if (isLang(fromQuery)) lang = fromQuery;
  else if (isLang(fromHash)) lang = fromHash;
  else if (isLang(saved)) lang = saved;
} catch {}
let T = I18N[lang];

function applyLang(next) {
  lang = next;
  T = I18N[lang];
  try { localStorage.setItem("assistantLang", lang); } catch {}
  // Mirror it into the URL so a Safari-initiated reload keeps the choice.
  // Prefer a clean ?lang= via replaceState; fall back to the hash where
  // replaceState isn't available (setting the hash never reloads the page).
  try {
    if (typeof history.replaceState === "function") {
      const u = new URL(location.href);
      u.searchParams.set("lang", lang);
      history.replaceState(null, "", u);
    } else if (location.hash !== "#lang=" + lang) {
      location.hash = "lang=" + lang;
    }
  } catch {}
  document.documentElement.lang = lang;
  document.getElementById("subtitle").textContent = T.subtitle;
  document.getElementById("footer").textContent = T.footer;
  input.placeholder = T.placeholder;
  send.textContent = T.send;
  // Example questions only exist before the first message is sent.
  const chipWrap = document.getElementById("chips");
  if (chipWrap) {
    chipWrap.querySelectorAll(".chip").forEach((c, i) => { if (T.chips[i]) c.textContent = T.chips[i]; });
  }
  const sw = document.getElementById("langsw");
  sw.dataset.lang = lang; // drives the sliding pill
  sw.querySelectorAll("button").forEach((b) => {
    b.classList.toggle("on", b.dataset.lang === lang);
  });
}

document.getElementById("langsw").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-lang]");
  if (btn && btn.dataset.lang !== lang) applyLang(btn.dataset.lang);
});

applyLang(lang);

document.getElementById("chips").addEventListener("click", (e) => {
  if (e.target.classList.contains("chip")) { input.value = e.target.textContent; input.focus(); autosize(); }
});

input.addEventListener("input", autosize);
function autosize() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy) return;
  if (intro) intro.remove();

  addMsg("user", text);
  history.push({ role: "user", content: text });
  input.value = ""; autosize();

  setBusy(true);
  const bot = addMsg("bot", "");
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  bot.appendChild(cursor);

  let answer = "";

  // 1) Send the request (network / CORS layer).
  let res;
  try {
    res = await fetch(WORKER_ENDPOINT, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: history, lang }),
    });
  } catch (err) {
    failMsg(bot, cursor, T.errReach + (err && err.message ? err.message : err));
    setBusy(false);
    return;
  }

  // 2) HTTP-level error (the Worker answered, but not 2xx).
  if (!res.ok) {
    let msg = T.errHttp(res.status);
    try { const j = await res.json(); if (j.error) msg = j.error; } catch {}
    failMsg(bot, cursor, msg);
    setBusy(false);
    return;
  }

  // 3) Read the full response, then parse the SSE payload. Reading the whole
  //    body (rather than incrementally streaming it) is the most compatible
  //    path across browsers — iOS Safari included.
  let raw = "";
  try {
    raw = await res.text();
  } catch (err) {
    failMsg(bot, cursor, T.errRead + (err && err.message ? err.message : err));
    setBusy(false);
    return;
  }

  let streamErr = null;
  for (const evt of raw.split("\n\n")) {
    const line = evt.split("\n").find((l) => l.startsWith("data:"));
    if (!line) continue;
    let d; try { d = JSON.parse(line.slice(5).trim()); } catch { continue; }
    if (d.type === "content_block_delta" && d.delta && d.delta.type === "text_delta") answer += d.delta.text;
    else if (d.type === "error") streamErr = (d.error && d.error.message) || "The assistant returned an error.";
  }

  if (!answer) { failMsg(bot, cursor, streamErr || T.errNone); setBusy(false); return; }

  // 4) Render the answer.
  cursor.remove();
  bot.textContent = answer;
  chat.scrollTop = chat.scrollHeight;
  history.push({ role: "assistant", content: answer });
  setBusy(false);
});

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function failMsg(el, cursor, msg) { cursor.remove(); el.classList.add("err"); el.textContent = msg; }
const isDesktop = !window.matchMedia || window.matchMedia("(min-width:641px)").matches;
function setBusy(v) { busy = v; send.disabled = v; input.disabled = v; if (!v && isDesktop) input.focus(); }
</script>
<script data-goatcounter="https://jesserstrait.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body></html>
